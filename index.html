  <script>
    (function () {
      var language = '';
      try { language = localStorage.getItem('tiles-studio-language') || ''; } catch (_) { }
      if (language !== 'en' && language !== 'es') {
        var browserLanguage = (navigator.language || 'en').toLowerCase();
        language = /^(es|ca)(-|$)/.test(browserLanguage) ? 'es' : 'en';
      }
      location.replace(language + '/' + location.search + location.hash);
    })();
  </script>
  <meta http-equiv="refresh" content="0;url=en/" />
